name: AEP import

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aep-import-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  RUST_TEST_THREADS: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev
      - name: Install converter and lint tools
        run: python -m pip install -r tools/aep-import/requirements.txt ruff==0.17.1
      - name: Select the converter interpreter
        shell: bash
        run: python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write("EFFECTCRAFT_PYTHON=" + sys.executable + "\n")'
      - name: Test the converter
        run: python -m unittest discover -s tools/aep-import -v
      - name: Lint Python
        run: ruff check tools/aep-import
      - name: Check Python formatting
        run: ruff format --check tools/aep-import
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check native apps with AEP import enabled
        run: cargo clippy --locked --release --workspace --all-targets --features effectcraft/aep,effectcraft-cli/aep -- -D warnings
      - name: Test AEP import and the existing engine
        run: cargo test --locked --release -p effectcraft-host -p effectcraft-engine --features effectcraft-host/aep
